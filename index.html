<!doctype html>
<html lang="el">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/spendwise-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="SpendWise - Track your income and expenses easily. Manage your personal finances with smart budgets, goals, and real-time insights." />

  <!-- Preconnect to font origins to reduce latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Load Google Fonts asynchronously (non-render-blocking) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" media="print" onload="this.media='all'" crossorigin />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" /></noscript>

  <link rel="apple-touch-icon" href="/spendwise-logo.webp">
  <title>SpendWise</title>
</head>

<body>
  <style>
    body { 
      margin: 0; 
      background-color: #0B0B0F; 
      color: white;
    }
  </style>
  <main>
  <!-- Inline Loading Screen — OUTSIDE #root so React doesn't remove it.
       Zero external resources. Zero filter ops. GPU-only animations.
       The useEffect in App.jsx fades it out when the app is ready. -->
  <div id="inline-loader" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,58,237,0.18) 0%, transparent 70%), #08080D;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: white;
      overflow: hidden;
    ">

      <!-- Main content -->
      <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;">

        <!-- CSS lettermark + border spinner (no image, no filter, no gradient paint) -->
        <div style="position: relative; width: 92px; height: 92px; margin-bottom: 36px;">
          <!-- Spinner ring: single border, GPU-composited transform only -->
          <div class="sw-spin" style="
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(124,58,237,0.15);
            border-top-color: rgba(124,58,237,0.9);
            border-right-color: rgba(6,182,212,0.7);
          "></div>
          <!-- Outer slow ring -->
          <div class="sw-spin-slow" style="
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(167,139,250,0.08);
            border-bottom-color: rgba(167,139,250,0.35);
          "></div>
          <!-- Lettermark "S" -->
          <div style="
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #a78bfa 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
          ">S</div>
        </div>

        <!-- Brand Name -->
        <div style="text-align: center;">
          <h1 style="
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -0.04em;
            margin: 0;
            background: linear-gradient(135deg, #ffffff 0%, rgba(167,139,250,0.95) 50%, rgba(6,182,212,0.85) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
          ">SpendWise</h1>
          <p style="
            margin-top: 8px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.45em;
            color: rgba(255,255,255,0.3);
          ">Master Your Finances</p>
        </div>

        <!-- Divider -->
        <div style="
          margin-top: 36px;
          width: 180px;
          height: 1px;
          background: linear-gradient(90deg, transparent, rgba(124,58,237,0.5), rgba(6,182,212,0.5), transparent);
        "></div>

        <!-- Progress bar — transform: scaleX() is GPU-composited, zero paint -->
        <div style="margin-top: 20px; width: 200px;">
          <div style="
            width: 100%;
            height: 2px;
            border-radius: 9999px;
            background: rgba(255,255,255,0.06);
            overflow: hidden;
          ">
            <div class="sw-progress" style="
              height: 100%;
              border-radius: 9999px;
              transform-origin: left center;
              background: linear-gradient(90deg, rgba(124,58,237,0.8), rgba(6,182,212,0.9));
            "></div>
          </div>
        </div>

        <!-- Status -->
        <p style="
          margin-top: 16px;
          font-size: 9px;
          font-family: monospace;
          letter-spacing: 0.3em;
          text-transform: uppercase;
          color: rgba(255,255,255,0.22);
        ">INITIALIZING...</p>
      </div>

      <!-- Footer stamp -->
      <div style="
        position: absolute;
        bottom: 28px;
        display: flex;
        align-items: center;
        gap: 8px;
      ">
        <div style="width: 14px; height: 1px; background: rgba(255,255,255,0.12);"></div>
        <span style="font-size: 8px; letter-spacing: 0.35em; text-transform: uppercase; font-weight: 500; color: rgba(255,255,255,0.18);">Powered by SpendWise</span>
        <div style="width: 14px; height: 1px; background: rgba(255,255,255,0.12);"></div>
      </div>
    </div>

    <!-- Loader keyframes: only transform animations (GPU composited, no paint) -->
    <style>
      @keyframes sw-spin  { to { transform: rotate(360deg); } }
      @keyframes sw-prog  {
        0%   { transform: scaleX(0.08); }
        40%  { transform: scaleX(0.55); }
        70%  { transform: scaleX(0.78); }
        100% { transform: scaleX(0.92); }
      }
      .sw-spin      { animation: sw-spin 1.1s linear infinite; }
      .sw-spin-slow { animation: sw-spin 4s linear infinite reverse; }
      .sw-progress  { animation: sw-prog 2.5s cubic-bezier(0.4,0,0.2,1) forwards; }
    </style>
  </div>
  <!-- React mounts here — inline-loader stays visible on top until App.jsx fades it out -->
  <div id="root"></div>
  </main>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
